<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LogiX Port</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: harbour-control console — navy quay band on top, steel-grey working surface, container-orange as the single accent */
:root{
  --bg:#edf1f4; --surface:#ffffff; --surface2:#f5f8fa; --ink:#112231; --muted:#5b6c7b; --line:#d3dce3;
  --accent:#de5d14; --accent-ink:#ffffff; --sea:#1d5d89; --sea-deep:#0f2f47; --band-ink:#e8f0f6;
  --ok:#1b8657; --warn:#b97d00; --bad:#c3352b; --ok-bg:#e3f4ec; --warn-bg:#fbf1d9; --bad-bg:#fbe5e2;
  --grid:#e3e9ee; --water:#cfe1ee; --yard:#d9dfe4;
  --f-display:"Chakra Petch","IBM Plex Sans Thai",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1620; --surface:#13212d; --surface2:#182a38; --ink:#e3ebf1; --muted:#93a5b4; --line:#253847;
  --accent:#f0793a; --accent-ink:#1a0d05; --sea:#5aa2d6; --sea-deep:#08131c; --band-ink:#dfe9f1;
  --ok:#3db67e; --warn:#e1aa2b; --bad:#ee6156; --ok-bg:#12301f; --warn-bg:#33280c; --bad-bg:#3a1714;
  --grid:#1f3140; --water:#123247; --yard:#1d2c38; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1620; --surface:#13212d; --surface2:#182a38; --ink:#e3ebf1; --muted:#93a5b4; --line:#253847;
  --accent:#f0793a; --accent-ink:#1a0d05; --sea:#5aa2d6; --sea-deep:#08131c; --band-ink:#dfe9f1;
  --ok:#3db67e; --warn:#e1aa2b; --bad:#ee6156; --ok-bg:#12301f; --warn-bg:#33280c; --bad-bg:#3a1714;
  --grid:#1f3140; --water:#123247; --yard:#1d2c38; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 var(--f-body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--sea-deep)}
h1,h2,h3{font-family:var(--f-display);line-height:1.25;text-wrap:balance;margin:0}
h2{font-size:1.45rem;font-weight:600}
h3{font-size:1.05rem;font-weight:600}
.mono,td.n,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
a{color:var(--sea)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--sea-deep);color:var(--band-ink);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-in{max-width:1320px;margin:0 auto;display:flex;align-items:center;gap:18px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand b{font-family:var(--f-display);font-size:1.15rem;letter-spacing:.04em}
.brand small{display:block;font-size:.72rem;opacity:.75;letter-spacing:.06em;text-transform:uppercase}
.logo{width:34px;height:34px;flex:none}
nav.tabs{display:flex;gap:2px;overflow-x:auto;flex:1 1 520px;min-width:0;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{color:var(--band-ink);opacity:.72;text-decoration:none;padding:7px 11px;border-radius:7px;white-space:nowrap;font-size:.9rem}
nav.tabs a:hover{opacity:1;background:rgba(255,255,255,.07)}
nav.tabs a.on{opacity:1;background:var(--accent);color:var(--accent-ink);font-weight:600}
.syncchip{font-size:.75rem;padding:4px 10px;border-radius:99px;border:1px solid rgba(255,255,255,.25);white-space:nowrap}
.syncchip.live{border-color:var(--ok);color:var(--ok)}
main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:22px 60px}
.wrap{max-width:1320px;margin:0 auto;display:grid;gap:20px}
.pagehead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.pagehead p{margin:4px 0 0;color:var(--muted);max-width:75ch}
.eyebrow{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:600}
/* panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.panel>h3{margin-bottom:10px}
.panel .sub{color:var(--muted);font-size:.86rem;margin:-6px 0 12px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:20px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:20px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:2px;position:relative}
.kpi .lb{font-size:.78rem;color:var(--muted)}
.kpi .v{font-family:var(--f-mono);font-size:1.45rem;font-weight:500;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:.75rem;color:var(--muted);margin-left:4px;font-family:var(--f-body)}
.kpi .ft{font-size:.75rem;color:var(--muted)}
.kpi[data-s="ok"]{box-shadow:inset 3px 0 0 var(--ok)}
.kpi[data-s="warn"]{box-shadow:inset 3px 0 0 var(--warn)}
.kpi[data-s="bad"]{box-shadow:inset 3px 0 0 var(--bad)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:.75rem;font-weight:600;padding:2px 9px;border-radius:99px;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.info{background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
/* tables */
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:.86rem}
th{background:var(--surface2);text-align:left;font-weight:600;color:var(--muted);font-size:.76rem;letter-spacing:.03em;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:6px 10px;border-bottom:1px solid var(--grid);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right}
tr.best td{background:var(--ok-bg)}
tr.hl td{background:var(--warn-bg)}
td input,td select{width:100%;min-width:70px;border:1px solid transparent;background:transparent;padding:4px 6px;border-radius:5px}
td input:hover,td select:hover{border-color:var(--line)}
td input:focus,td select:focus{border-color:var(--accent);background:var(--surface);outline:none}
td input.n{text-align:right;font-family:var(--f-mono)}
/* controls */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500;font-size:.88rem}
.btn:hover{border-color:var(--sea)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.sea{background:var(--sea);color:#fff;border-color:var(--sea)}
.btn.sm{padding:4px 10px;font-size:.8rem}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.field{display:grid;gap:4px;font-size:.82rem;color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:7px 9px;color:var(--ink);font-size:.9rem;min-width:0;width:100%}
.ctrl{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.slider{display:grid;gap:2px;font-size:.82rem}
.slider b{font-family:var(--f-mono);color:var(--ink)}
input[type=range]{width:100%;accent-color:var(--accent)}
/* formula block */
.calc{font-family:var(--f-mono);font-size:.84rem;background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:12px 14px;overflow-x:auto;white-space:pre;line-height:1.75}
.calc .c{color:var(--muted)} .calc .r{color:var(--accent);font-weight:500} .calc .h{color:var(--sea);font-weight:500}
.why{border-left:3px solid var(--sea);padding:6px 12px;background:var(--surface2);border-radius:0 8px 8px 0;font-size:.88rem;margin-top:10px}
/* decision */
.dec{display:grid;gap:10px}
.dec-item{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;padding:12px;border-radius:8px;border:1px solid var(--line);background:var(--surface2)}
.dec-item .ic{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;font-weight:700;font-family:var(--f-mono);grid-row:span 2}
.dec-item[data-l="bad"] .ic{background:var(--bad-bg);color:var(--bad)}
.dec-item[data-l="warn"] .ic{background:var(--warn-bg);color:var(--warn)}
.dec-item[data-l="ok"] .ic{background:var(--ok-bg);color:var(--ok)}
.dec-item[data-l="info"] .ic{background:var(--surface);color:var(--sea);border:1px solid var(--line)}
.dec-item b{font-size:.94rem}
.dec-item p{margin:0;font-size:.86rem;color:var(--muted)}
.headline{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center;padding:16px 18px;border-radius:var(--r);background:var(--sea-deep);color:var(--band-ink)}
.headline h2{font-size:1.25rem}
.headline p{margin:4px 0 0;opacity:.85;font-size:.9rem}
@media (max-width:640px){.headline{grid-template-columns:1fr}}
/* charts */
.chart{width:100%;min-height:220px}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{fill:var(--muted);font-family:var(--f-mono);font-size:11px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.78rem;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
/* gantt */
.gantt{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface2)}
.gantt svg text{font-family:var(--f-mono);font-size:11px;fill:var(--ink)}
/* twin */
/* 3D twin viewport: a fixed daytime scene, same in both themes */
.tw3wrap{position:relative;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:linear-gradient(180deg,#7fb5d8 0%,#b7d6ea 38%,#d6e8f2 70%,#d6e8f2 100%)}
#twin3{display:block;width:100%;height:clamp(340px,62vh,660px);touch-action:none;cursor:grab}
.tw-lbls{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.tw-lbl{position:absolute;left:0;top:0;white-space:nowrap;font-size:.72rem;font-weight:600;line-height:1.3;padding:3px 8px;border-radius:6px;background:rgba(12,27,40,.84);color:#f2f6f9;border-left:3px solid #3db67e;will-change:transform}
.tw-lbl[data-s="warn"]{border-left-color:#e6ad2c}.tw-lbl[data-s="bad"]{border-left-color:#f0604f;background:rgba(70,16,12,.86)}.tw-lbl[data-s="info"]{border-left-color:#9fb3c4}
.tw-hud{position:absolute;font-size:.75rem;color:#0f2f47;background:rgba(255,255,255,.72);border-radius:6px;padding:3px 8px;pointer-events:none}
.tw-clock{right:10px;top:10px;font-family:var(--f-mono);font-weight:500}
.tw-hint{left:10px;bottom:10px}
@media (max-width:640px){.tw-hint{display:none}}
.twinbox{position:relative;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:var(--water)}
#twin{display:block;width:100%;height:auto;max-width:100%}
.twinstats{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.toast{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--sea-deep);color:var(--band-ink);padding:10px 16px;border-radius:9px;font-size:.88rem;z-index:50;max-width:min(420px,calc(100vw - 32px));box-shadow:0 6px 24px rgba(0,0,0,.25)}
.note{font-size:.8rem;color:var(--muted)}
.warnbox{background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:10px 12px;font-size:.86rem}
.badbox{background:var(--bad-bg);color:var(--bad);border-radius:8px;padding:10px 12px;font-size:.86rem}
.okbox{background:var(--ok-bg);color:var(--ok);border-radius:8px;padding:10px 12px;font-size:.86rem}
.flow{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:.82rem}
.flow span{padding:4px 10px;border:1px solid var(--line);border-radius:99px;background:var(--surface2)}
.flow span.bn{border-color:var(--bad);color:var(--bad);font-weight:600}
details summary{cursor:pointer;font-weight:600}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{header.top,.noprint{display:none!important} body{background:#fff} .panel{break-inside:avoid}}
</style>
</head>

<script>

/* ================= CALC-START : ฟังก์ชันคำนวณตามทฤษฎี (ไม่มี UI ทดสอบแยกได้) ================= */
const SHEETS = ['Params','Stations','VesselClasses','Berths','Cranes','Vessels','Scenarios','TruckLog','GateCounts'];
const NUMCOLS = {
  Params:['value'], Stations:['servers','service_min','cv_service','visit_ratio','cost_per_server_hr'],
  VesselClasses:['moves_avg','cranes','fixed_hr','share'], Berths:['length_m','depth_m','max_cranes'],
  Cranes:['rate_mph'], Vessels:['moves'], Scenarios:['gate_in','insp','berths','crane_add','truck_ca','lambda_factor'],
  TruckLog:[], GateCounts:['hour','trucks']
};
function normalizeSheet(name, rows){
  const nc = NUMCOLS[name]||[];
  return (rows||[]).filter(r=>Object.values(r).some(v=>String(v??'').trim()!=='')).map(r=>{
    const o={}; for(const k in r){ let v=r[k]; if(typeof v==='string') v=v.trim();
      if(nc.includes(k)){ if(v===''||v==null) o[k]=''; else { const x=Number(String(v).replace(/,/g,'')); o[k]=isNaN(x)?v:x; } }
      else if(name==='Params'&&k==='value'){ const x=Number(v); o[k]=(v!==''&&!isNaN(x))?x:v; }
      else o[k]=v; }
    return o; });
}
function paramMap(db){ const P={}; db.Params.forEach(r=>{ const x=Number(r.value); P[r.key]=(r.value!==''&&!isNaN(x))?x:r.value; }); return P; }
const blank = v => v===''||v==null||(typeof v==='number'&&isNaN(v));

/* Erlang C สำหรับ M/M/c  (λ, μ ต่อชั่วโมง) */
function erlangC(lam, mu, c){
  c = Math.max(1, Math.round(c));
  const a = lam/mu, rho = a/c;
  const terms=[]; let t=1, sum=0;
  for(let k=0;k<c;k++){ if(k>0) t*=a/k; terms.push(t); sum+=t; }
  const tc = (c===1? a : t*a/c); // a^c / c!
  const base = {lam,mu,c,a,rho,terms,sum,tc};
  if(!(rho<1)) return {...base, stable:false, pw:1, wq:Infinity, lq:Infinity, w:Infinity, l:Infinity};
  const top = tc/(1-rho), pw = top/(sum+top), wq = pw/(c*mu-lam);
  return {...base, stable:true, top, p0:1/(sum+top), pw, wq, lq:lam*wq, w:wq+1/mu, l:lam*(wq+1/mu)};
}
/* M/M/c + Allen–Cunneen G/G/c */
function queueNode(lam, mu, c, ca, cs, model){
  const m = erlangC(lam, mu, c);
  const f = (ca*ca + cs*cs)/2;
  const g = m.stable ? {wq:m.wq*f, lq:lam*m.wq*f, w:m.wq*f+1/mu, l:lam*(m.wq*f+1/mu)} : {wq:Infinity,lq:Infinity,w:Infinity,l:Infinity};
  const sel = model==='MMc' ? {wq:m.wq,lq:m.lq,w:m.w,l:m.l} : g;
  return {mmc:m, ggc:g, f, ca, cs, sel, rho:m.rho, stable:m.stable, pw:m.pw, model, thr: m.stable?lam:c*mu};
}
function berthService(db, P, craneAdd){
  const active = db.Cranes.filter(c=>c.status==='Active' && c.type==='STS');
  const rate = active.length ? active.reduce((s,c)=>s+Number(c.rate_mph),0)/active.length : 25;
  const cvw = Number(P.service_cv_within)||0;
  const shareSum = db.VesselClasses.reduce((s,c)=>s+Number(c.share),0)||1;
  const capB = db.Berths.filter(b=>b.status==='Active').map(b=>Number(b.max_cranes)||99);
  const cap = capB.length ? Math.max(...capB) : 99; // เครนต่อลำต้องไม่เกินที่ท่ารองรับ
  const cls = db.VesselClasses.map(c=>{
    const cr = Math.min(Number(c.cranes)+(craneAdd||0), cap);
    const work = Number(c.moves_avg)/(cr*rate);
    const s = work + Number(c.fixed_hr);
    return {cls:c['class'], p:Number(c.share)/shareSum, moves:Number(c.moves_avg), cranes:cr, work, fixed:Number(c.fixed_hr), s};
  });
  const mean = cls.reduce((a,c)=>a+c.p*c.s,0);
  const es2 = cls.reduce((a,c)=>a+c.p*c.s*c.s*(1+cvw*cvw),0);
  const cs = Math.sqrt(Math.max(0, es2-mean*mean))/mean;
  const movesAvg = cls.reduce((a,c)=>a+c.p*c.moves,0);
  const maxCr = Math.max(...cls.map(c=>c.cranes));
  return {rate, activeCranes:active.length, cls, mean, es2, cs, movesAvg, maxCr, cvw};
}
/* สร้างโมเดลทั้งท่าเรือจาก Master Data (ทุกหน้าใช้ฟังก์ชันนี้ร่วมกัน) */
function buildModel(db, ov){
  ov = ov||{};
  const P = paramMap(db);
  const model = ov.model || P.queue_model || 'GGc';
  const lf = blank(ov.lambda_factor)?1:Number(ov.lambda_factor);
  const lamT = Number(P.truck_lambda)*lf;
  const caT = blank(ov.truck_ca)?Number(P.truck_ca):Number(ov.truck_ca);
  const stations = db.Stations.map(s=>{
    let c = Number(s.servers);
    if(s.id==='GATE_IN' && !blank(ov.gate_in)) c=Number(ov.gate_in);
    if(s.id==='INSP' && !blank(ov.insp)) c=Number(ov.insp);
    if(ov.servers && !blank(ov.servers[s.id])) c=Number(ov.servers[s.id]);
    const lam = lamT*Number(s.visit_ratio), mu = 60/Number(s.service_min);
    const q = queueNode(lam, mu, c, caT, Number(s.cv_service), model);
    const costWait = q.stable ? q.sel.lq*Number(P.cost_truck_wait) : Infinity;
    const costRes = c*Number(s.cost_per_server_hr);

function analyzeTruckLog(rows){
  const TRAVEL = {DOC:0.3*60, INSP:0.5*60, RTG:4*60, GATE_OUT:3*60}; // วินาที: เวลาวิ่งระหว่างจุด (คงที่ ไม่นับเป็นการรอ)

    const a=hms(r.arrive_gate), gs=hms(r.gate_start), ge=hms(r.gate_end), ds=hms(r.doc_start), de=hms(r.doc_end),
      is=hms(r.insp_start), ie=hms(r.insp_end), ys=hms(r.yard_start), ye=hms(r.yard_end), xs=hms(r.exit_start), xe=hms(r.exit_end);
    const ins = String(r.insp).toUpperCase()==='Y';

      w:{GATE_IN:gs-a, DOC:ds-ge-TRAVEL.DOC, INSP: ins? is-de-TRAVEL.INSP : NaN, RTG: ys-(ins?ie:de)-TRAVEL.RTG, GATE_OUT: xs-ye-TRAVEL.GATE_OUT},
      s:{GATE_IN:ge-gs, DOC:de-ds, INSP: ins? ie-is : NaN, RTG: ye-ys, GATE_OUT: xe-xs},
      total:(xe-a)};
  });
  const ok = recs.filter(r=>!isNaN(r.a) && !isNaN(r.total));
  const st = {};
  ['GATE_IN','DOC','INSP','RTG','GATE_OUT'].forEach(k=>{
    const w = ok.map(r=>r.w[k]).filter(x=>!isNaN(x)), s = ok.map(r=>r.s[k]).filter(x=>!isNaN(x));
    st[k] = {n:s.length, waitMin:mean(w)/60, waitMax:Math.max(0,...w)/60, svcMin:mean(s)/60, svcCv: s.length>1? sd(s)/mean(s):0};
  });
  const arr = ok.map(r=>r.a).sort((x,y)=>x-y);
  const ia = arr.slice(1).map((x,i)=>x-arr[i]);
  const spanH = arr.length>1 ? (arr[arr.length-1]-arr[0])/3600 : NaN;
  const lam = arr.length>1 ? (arr.length-1)/spanH : NaN;

}
/* พยากรณ์รถเข้าแต่ละชั่วโมง: แนวโน้มรายวัน (Linear Regression) × ดัชนีฤดูกาลรายชั่วโมง */

function chart(el, o){
  if(!el) return; const W=o.w||Math.max(300, Math.round(el.clientWidth||640)), H=o.h||260, L=o.left||52, R=o.right||14, T=14, B=o.bottom||40;
  const pw=W-L-R, ph=H-T-B; const n=o.labels.length;
  let vals=[]; o.series.forEach(s=>s.data.forEach((v,i)=>{ if(isFinite(v)) vals.push(v + (s.err? (s.err[i]||0):0)); }));
  (o.refs||[]).forEach(r=>vals.push(r.y));
  let ymax = o.ymax!=null? o.ymax : Math.max(1e-9,...vals)*1.12; let ymin = o.ymin||0;
  const nice = (x)=>{ const e=Math.pow(10,Math.floor(Math.log10(x))); const f=x/e; return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*e; };
  const step = nice((ymax-ymin)/5); ymax = Math.ceil(ymax/step)*step;
  const y = v=> T+ph-(Math.min(Math.max(v,ymin),ymax)-ymin)/(ymax-ymin)*ph;
  const bw = pw/n; const x = i=> L+bw*(i+0.5);
  let g=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.title||'chart')}">`;
  for(let v=ymin; v<=ymax+1e-9; v+=step){ g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${fmt(v, Number.isInteger(+step.toFixed(6))?0:Number.isInteger(+(step*10).toFixed(6))?1:2)}</text>`; }
  const bars = o.series.filter(s=>s.type!=='line'); const nb=bars.length||1; const gw=bw*0.72; const each=gw/nb;
  bars.forEach((s,k)=> s.data.forEach((v,i)=>{ if(!isFinite(v)) { g+=`<text x="${x(i)-gw/2+each*k+each/2}" y="${T+12}" text-anchor="middle" style="fill:var(--bad)">∞</text>`; return; }
    const col = typeof s.color==='function'? s.color(v,i): s.color; const bx=x(i)-gw/2+each*k;
    g+=`<rect x="${bx+1}" y="${y(v)}" width="${Math.max(1,each-2)}" height="${Math.max(0,y(ymin)-y(v))}" rx="2" fill="${col}"><title>${esc(o.labels[i])}: ${fmt(v,2)}</title></rect>`;
    if(s.err){ const e=s.err[i]||0, cx=bx+each/2; g+=`<path d="M${cx} ${y(v-e)}V${y(v+e)}M${cx-4} ${y(v-e)}h8M${cx-4} ${y(v+e)}h8" stroke="var(--ink)" stroke-width="1.2" fill="none"/>`; }
    if(s.labels) g+=`<text x="${bx+each/2}" y="${y(v)-5}" text-anchor="middle" style="fill:var(--ink)">${s.labels(v,i)}</text>`; }));
  o.series.filter(s=>s.type==='line').forEach(s=>{ let d='', on=false; s.data.forEach((v,i)=>{ if(isFinite(v)){ d+=(on?'L':'M')+x(i)+' '+y(v); on=true; } else on=false; });
    if(s.area) g+=`<path d="${d}L${x(n-1)} ${y(ymin)}L${x(0)} ${y(ymin)}Z" fill="${s.color}" opacity=".12"/>`;
    g+=`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2.2" ${s.dash?'stroke-dasharray="5 4"':''}/>`;
    s.data.forEach((v,i)=>{ if(isFinite(v) && (s.dots||i===n-1)) g+=`<circle cx="${x(i)}" cy="${y(v)}" r="3.2" fill="${s.color}"><title>${esc(o.labels[i])}: ${fmt(v,2)}</title></circle>`; }); });
  (o.refs||[]).forEach((r,k)=>{ const right=k%2===0; g+=`<line x1="${L}" x2="${W-R}" y1="${y(r.y)}" y2="${y(r.y)}" stroke="${r.color}" stroke-width="1.6" stroke-dasharray="6 4"/><text x="${right?W-R:L+6}" y="${y(r.y)+(right?-5:13)}" text-anchor="${right?'end':'start'}" style="fill:${r.color}">${esc(r.label)}</text>`; });
  const every = Math.ceil(n/(o.maxLabels||14));
  o.labels.forEach((lb,i)=>{ if(i%every===0) g+=`<text x="${x(i)}" y="${H-B+16}" text-anchor="middle">${esc(lb)}</text>`; });
  if(o.xTitle) g+=`<text x="${L+pw/2}" y="${H-4}" text-anchor="middle">${esc(o.xTitle)}</text>`;
  if(o.yTitle) g+=`<text transform="translate(12 ${T+ph/2}) rotate(-90)" text-anchor="middle">${esc(o.yTitle)}</text>`;
  g+=`<line x1="${L}" x2="${W-R}" y1="${y(ymin)}" y2="${y(ymin)}" stroke="var(--muted)"/></svg>`;
  const leg = o.series.filter(s=>s.name).map(s=>`<span><i style="background:${typeof s.color==='function'?'var(--sea)':s.color}"></i>${esc(s.name)}</span>`).concat((o.refs||[]).map(r=>`<span><i style="background:${r.color}"></i>${esc(r.label)}</span>`)).join('');
  el.innerHTML = g + (leg?`<div class="legend">${leg}</div>`:'');
}

/* ================= GOOGLE SHEETS + LINE ================= */
async function api(method, action, body){
  if(!CFG.url) throw new Error('ยังไม่ได้ใส่ URL ของ Apps Script');
  if(method==='GET'){ const r=await fetch(CFG.url+(CFG.url.includes('?')?'&':'?')+'action='+action+'&t='+Date.now()); if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); }
  const r = await fetch(CFG.url, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(Object.assign({action}, body||{}))});
  if(!r.ok) throw new Error('HTTP '+r.status); const t=await r.text(); try{ return JSON.parse(t); }catch(e){ return {ok:true, text:t}; }
}
async function pull(silent){
  try{ const j = await api('GET','all'); let n=0; const before=JSON.stringify(DB);
    SHEETS.forEach(k=>{ if(Array.isArray(j[k]) && j[k].length){ DB[k]=normalizeSheet(k,j[k]); n++; } });
    CFG.lastSync=new Date().toLocaleString('th-TH'); saveCfg();
    const changed = JSON.stringify(DB)!==before;
    if(changed || !silent){ recompute(); }
    if(!silent) toast(`ดึงข้อมูล ${n} แท็บจาก Google Sheets แล้ว`); else if(changed) toast('ข้อมูลใน Google Sheets เปลี่ยน อัปเดตทุกหน้าแล้ว');
  }catch(e){ if(!silent) toast('ดึงข้อมูลไม่สำเร็จ: '+e.message, 5000); }
}
async function pushMaster(){
  try{ const sheets={}; SHEETS.forEach(k=>sheets[k]=DB[k]); const r=await api('POST','replaceMany',{sheets}); CFG.lastSync=new Date().toLocaleString('th-TH'); saveCfg(); toast(r.ok?'บันทึก Master Data ทั้งหมดขึ้น Google Sheets แล้ว':'ผิดพลาด: '+(r.error||'')); }
  catch(e){ toast('บันทึกไม่สำเร็จ: '+e.message, 5000); }
}

/* ================= PAGE: QUEUE CALC (STEP BY STEP) ================= */
let QNODE='GATE_IN';
function nodeInfo(id){
  if(id==='BERTH'){ const b=M.berth; return {name:'ท่าเทียบเรือ (Berth)', unitA:'ลำ/ชม.', unitT:'ชม.', lam:b.lam, mu:b.mu, c:b.c, ca:Number(M.P.vessel_ca), cs:b.svc.cs, svc:b.svc.mean, svcUnit:'ชม./ลำ', q:b.q, tscale:1, cust:'ลำ'}; }
  const s=M.stations.find(x=>x.id===id); return {name:s.name, unitA:'คัน/ชม.', unitT:'นาที', lam:s.lam, mu:s.mu, c:s.c, ca:M.caT, cs:s.cv, svc:s.service, svcUnit:'นาที/คัน', q:s.q, tscale:60, cust:'คัน', visit:s.visit, base:M.lamT};
}
function stepsHtml(id){
  const N=nodeInfo(id), m=N.q.mmc, ts=N.tscale;
  const svcLine = id==='BERTH'
    ? M.berth.svc.cls.map(c=>`<span class="c">  ${c.cls.padEnd(13)} p=${fmt(c.p,2)}  ${c.moves} ÷ (${c.cranes}×${fmt(M.berth.svc.rate,2)}) + ${c.fixed} = </span>${fmt(c.s,3)} ชม.`).join('\n')+`\n<span class="c">  E[S] = Σ p·S = </span><span class="r">${fmt(N.svc,3)} ชม./ลำ</span>`
    : `<span class="c">เวลาบริการเฉลี่ย</span> = ${fmt(N.svc,2)} นาที/คัน  <span class="c">(จาก Master Data: Stations)</span>`;
  let s = `<span class="h">ขั้นที่ 1 · ข้อมูลเข้า (แปลงหน่วยเป็น "ต่อชั่วโมง" ทั้งหมด)</span>
${id!=='BERTH'?`<span class="c">λ ของจุดนี้ = λ รถทั้งหมด × visit_ratio</span> = ${fmt(N.base,2)} × ${fmt(N.visit,2)} = <span class="r">${fmt(N.lam,3)} ${N.unitA}</span>`:`<span class="c">λ เรือ (Params.vessel_lambda × ตัวคูณ)</span> = <span class="r">${fmt(N.lam,4)} ${N.unitA}</span>`}
${svcLine}
<span class="c">μ = 1 ÷ เวลาบริการ</span> = ${id==='BERTH'?`1 ÷ ${fmt(N.svc,3)}`:`60 ÷ ${fmt(N.svc,2)}`} = <span class="r">${fmt(N.mu,4)} ${N.unitA}/เซิร์ฟเวอร์</span>
<span class="c">c (จำนวนเซิร์ฟเวอร์)</span> = <span class="r">${N.c}</span>

<span class="h">ขั้นที่ 2 · ภาระงานและความเสถียร</span>
<span class="c">a = λ ÷ μ</span> = ${fmt(N.lam,4)} ÷ ${fmt(N.mu,4)} = <span class="r">${fmt(m.a,4)}</span> <span class="c">Erlang (จำนวนเซิร์ฟเวอร์ที่ "ยุ่ง" เฉลี่ย)</span>
<span class="c">ρ = λ ÷ (c·μ)</span> = ${fmt(N.lam,4)} ÷ (${N.c} × ${fmt(N.mu,4)}) = <span class="r">${fmt(m.rho,4)}</span>  ${m.rho<1?'<span class="c">< 1 → ระบบเสถียร</span>':'<span class="r">≥ 1 → ไม่เสถียร คิวยาวไม่สิ้นสุด ต้องเพิ่ม c</span>'}`;
  if(!m.stable) return s;
  s += `

<span class="h">ขั้นที่ 3 · Erlang C หาโอกาสที่ต้องรอ P(wait)</span>
<span class="c">Σ aᵏ/k! (k = 0..c−1)</span> = ${m.terms.map(t=>fmt(t,4)).join(' + ')}
                    = <span class="r">${fmt(m.sum,4)}</span>
<span class="c">aᶜ/c! = ${fmt(m.a,4)}^${N.c} ÷ ${N.c}!</span> = <span class="r">${fmt(m.tc,4)}</span>
<span class="c">aᶜ/c! × 1/(1−ρ)</span> = ${fmt(m.tc,4)} ÷ ${fmt(1-m.rho,4)} = <span class="r">${fmt(m.top,4)}</span>
<span class="c">P(wait) = ${fmt(m.top,4)} ÷ (${fmt(m.sum,4)} + ${fmt(m.top,4)})</span> = <span class="r">${fmt(m.pw,4)}</span>  <span class="c">→ ${fmt(m.pw*100,1)}% ของ${N.cust}ที่มาต้องรอ</span>

<span class="h">ขั้นที่ 4 · M/M/c (Exponential ทั้งเวลามาถึงและเวลาบริการ)</span>
<span class="c">Wq = P(wait) ÷ (c·μ − λ)</span> = ${fmt(m.pw,4)} ÷ (${fmt(N.c*N.mu,4)} − ${fmt(N.lam,4)}) = ${fmt(m.wq,5)} ชม. = <span class="r">${fmt(m.wq*ts,3)} ${N.unitT}</span>
<span class="c">Lq = λ·Wq</span> = ${fmt(N.lam,4)} × ${fmt(m.wq,5)} = <span class="r">${fmt(m.lq,3)} ${N.cust}</span>
<span class="c">W = Wq + 1/μ</span> = ${fmt(m.wq*ts,3)} + ${fmt(ts/N.mu,3)} = <span class="r">${fmt(m.w*ts,3)} ${N.unitT}</span>
<span class="c">L = λ·W (Little's Law)</span> = <span class="r">${fmt(m.l,3)} ${N.cust}</span>

<span class="h">ขั้นที่ 5 · ปรับด้วยความแปรปรวนจริง: Allen–Cunneen G/G/c</span>
<span class="c">Ca = ${fmt(N.ca,3)} , Cs = ${fmt(N.cs,3)}  →  (Ca² + Cs²) ÷ 2</span> = (${fmt(N.ca*N.ca,4)} + ${fmt(N.cs*N.cs,4)}) ÷ 2 = <span class="r">${fmt(N.q.f,4)}</span>
<span class="c">Wq(G/G/c) ≈ Wq(M/M/c) × ${fmt(N.q.f,4)}</span> = ${fmt(m.wq*ts,3)} × ${fmt(N.q.f,4)} = <span class="r">${fmt(N.q.ggc.wq*ts,3)} ${N.unitT}</span>
<span class="c">Lq(G/G/c) = λ·Wq</span> = <span class="r">${fmt(N.q.ggc.lq,3)} ${N.cust}</span>
<span class="c">Throughput = λ (เพราะ ρ < 1)</span> = <span class="r">${fmt(N.lam,3)} ${N.unitA}</span>

<span class="h">ผลที่ระบบใช้ตัดสินใจ (queue_model = ${M.model})</span>  Wq = <span class="r">${fmt(N.q.sel.wq*ts,3)} ${N.unitT}</span> · Lq = <span class="r">${fmt(N.q.sel.lq,3)} ${N.cust}</span>`;
  return s;
}
function pQueue(){
  const N=nodeInfo(QNODE); const P=M.P; const ts=N.tscale;
  const opt = QNODE==='BERTH'? optimizeBerth(M) : optimizeStation(M, QNODE);
  $('#app').innerHTML = `
  <div class="pagehead"><div><div class="eyebrow">Queueing Theory · M/M/c, Erlang C, Allen–Cunneen, Little's Law</div><h2>คำนวณแถวคอยทีละขั้น</h2><p>เลือกจุดที่ต้องการตรวจ ระบบแสดงทุกบรรทัดตั้งแต่ข้อมูลเข้าจนถึงผลลัพธ์ ใช้เทียบกับการคำนวณมือได้ทันที</p></div></div>
  <div class="panel noprint"><div class="row">${[...M.stations.map(s=>[s.id,s.name]),['BERTH','ท่าเทียบเรือ']].map(([k,t])=>`<button class="btn sm ${k===QNODE?'pri':''}" data-q="${k}">${esc(t)}</button>`).join('')}</div></div>
  <div class="grid2">
    <div class="panel"><h3>${esc(N.name)} · c = ${N.c}</h3><div class="calc">${stepsHtml(QNODE)}</div>
      <div class="why"><b>ทำไมต้องใช้ M/M/c ไม่ใช่ M/M/1:</b> จุดนี้มี ${N.c} ช่องบริการใช้คิวร่วมกัน ถ้าแยกเป็น M/M/1 หลายแถวจะได้เวลารอสูงเกินจริง · <b>ทำไมต้องปรับ G/G/c:</b> เวลาบริการจริงไม่ได้สุ่มแบบ Exponential (Cs = ${fmt(N.cs,2)} ${N.cs<1?'< 1 นิ่งกว่า':'≥ 1'}) Allen–Cunneen จึงคูณด้วย (Ca²+Cs²)/2 ให้ใกล้ความจริง ซึ่งยืนยันด้วยหน้า <a href="#simulation">Simulation</a></div></div>
    <div class="panel"><h3>ถ้าเปลี่ยนจำนวนเซิร์ฟเวอร์</h3><p class="sub">ต้นทุนรวม TC = Lq × ต้นทุนรอ + ต้นทุนทรัพยากร (บาท/ชม.) แถวสีเขียวคือ c ที่ต้นทุนต่ำสุด</p>
      <div class="tbl"><table><thead><tr><th class="n">c</th><th class="n">ρ</th><th class="n">Wq (${N.unitT})</th><th class="n">Lq</th><th class="n">ต้นทุนรอ</th><th class="n">ต้นทุนทรัพยากร</th><th class="n">TC</th></tr></thead><tbody>
      ${opt.rows.map(r=>`<tr class="${r===opt.best?'best':''}"><td class="n">${r.c}${r.c===N.c?' ◀':''}</td><td class="n">${fmt(r.rho,3)}</td><td class="n">${fmt(QNODE==='BERTH'?r.wq:r.wq,2)}</td><td class="n">${fmt(r.lq,2)}</td><td class="n">${fmt(r.waitCost,0)}</td><td class="n">${fmt(r.resCost,0)}</td><td class="n"><b>${fmt(r.tc,0)}</b></td></tr>`).join('')}</tbody></table></div>
      <div class="chart" id="cQ" style="margin-top:12px"></div>
      <p class="why">ตัดสินใจ: c ที่เหมาะสม = <b>${opt.best.c}</b> (ปัจจุบัน ${N.c}) ${opt.best.c===N.c?'ไม่ต้องเปลี่ยน':opt.best.c>N.c?`ควรเพิ่ม ${opt.best.c-N.c} เพราะต้นทุนรอที่ลดได้มากกว่าต้นทุนที่เพิ่ม`:`ลดได้ ${N.c-opt.best.c} โดยเวลารอยังอยู่ในเกณฑ์`} · สังเกตว่าเมื่อ ρ เข้าใกล้ 1 เวลารอพุ่งแบบไม่เป็นเส้นตรง การเพิ่ม c ตัวแรกจึงได้ผลมากที่สุด แล้วผลตอบแทนลดลง</p></div>
  </div>`;
  document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{QNODE=b.dataset.q; pQueue();});
  chart($('#cQ'), {labels:opt.rows.map(r=>'c='+r.c), series:[{name:`Wq (${N.unitT})`, data:opt.rows.map(r=>r.wq), color:(v,i)=>opt.rows[i]===opt.best?'var(--ok)':'var(--sea)', labels:v=>fmt(v,1)}], yTitle:N.unitT, h:200});
}

function pWhatif(){
  const P=M.P; const base=M; const g0=M.stations.find(s=>s.id==='GATE_IN').c, i0=M.stations.find(s=>s.id==='INSP').c;

  const W = buildModel(DB, v);
  const rows = runScenarios(DB); const best=rows.find(r=>r.best);
  const cmp=(a,b,d,unit,lowGood=true)=>{ const diff=b-a; const good= lowGood? diff<0: diff>0; return `<td class="n">${fmt(a,d)}</td><td class="n">${fmt(b,d)}</td><td class="n" style="color:${!isFinite(diff)||Math.abs(diff)<1e-9?'var(--muted)':good?'var(--ok)':'var(--bad)'}">${isFinite(diff)?(diff>0?'+':'')+fmt(diff,d):'–'} ${unit}</td>`; };

  <div class="panel noprint"><h3>ปรับสถานการณ์</h3><div class="ctrl">

    ${sl('crane_add','เครนเพิ่มต่อลำ',v.crane_add,0,2,1)}${sl('truck_ca','Ca รถ (นัดหมาย→ต่ำ)',v.truck_ca,0.3,1.5,0.05)}${sl('lambda_factor','ตัวคูณดีมานด์',v.lambda_factor,0.6,1.6,0.05)}</div>
    <div class="row" style="margin-top:10px"><button class="btn sm" id="wReset">กลับค่าปัจจุบัน</button><span class="note">ไม่เปลี่ยน Master Data จนกว่าจะกด "ใช้เป็นค่าจริง"</span><button class="btn sm pri" id="wApply">ใช้เป็นค่าจริง</button></div></div>
  <div class="grid2">
    <div class="panel"><h3>เปรียบเทียบก่อน–หลัง</h3><div class="tbl"><table><thead><tr><th>ตัวชี้วัด</th><th class="n">ปัจจุบัน</th><th class="n">What-if</th><th class="n">ผลต่าง</th></tr></thead><tbody>

      <tr><td>รถรอทุกจุด Lq (คัน)</td>${cmp(base.truckLq,W.truckLq,2,'')}</tr>
      <tr><td>ρ คอขวดรถ</td>${cmp(base.bott.q.rho,W.bott.q.rho,3,'')}</tr>

      <tr><td>เรือรอ Lq (ลำ)</td>${cmp(base.berth.q.sel.lq,W.berth.q.sel.lq,3,'')}</tr>
      <tr><td>Berth Utilization</td>${cmp(base.berth.q.rho*100,W.berth.q.rho*100,1,'%')}</tr>
      <tr><td>Throughput รถ (คัน/ชม.)</td>${cmp(base.thrTrucks,W.thrTrucks,1,'',false)}</tr>
      <tr><td>เครนที่ต้องมี (คัน)</td>${cmp(base.crane.units,W.crane.units,0,'')}</tr>
      <tr><td><b>ต้นทุนรวม (บาท/ชม.)</b></td>${cmp(base.cost.total,W.cost.total,0,'')}</tr></tbody></table></div>
      ${!W.stable||!W.berth.q.stable?`<div class="badbox" style="margin-top:10px">ระบบไม่เสถียรในสถานการณ์นี้ (ρ ≥ 1) เวลารอเป็นอนันต์ ต้องเพิ่มทรัพยากร</div>`:''}</div>
    <div class="panel"><h3>องค์ประกอบต้นทุน (พันบาท/ชม.)</h3><div class="chart" id="cWI"></div><p class="why">ต้นทุนเรือรอต่อชั่วโมงสูงกว่าค่าท่าและเครนมาก ระบบจึงไม่เลือกทางที่ "รอสั้นสุด" แต่เลือกทางที่ต้นทุนรวมต่ำสุดตามสูตร TC = Σ(Lq × ต้นทุนรอ) + Σ(c × ต้นทุนทรัพยากร)</p></div>
  </div>
  <div class="panel"><h3>เปรียบเทียบ Scenario (จากแท็บ Scenarios)</h3><div class="tbl"><table><thead><tr><th>Scenario</th><th>รายละเอียด</th><th class="n">ประตู</th><th class="n">X-ray</th><th class="n">ท่า</th><th class="n">เครน+</th><th class="n">Ca</th><th class="n">ดีมานด์</th><th class="n">รถรอ (นาที)</th><th class="n">เรือรอ (ชม.)</th><th class="n">ρ สูงสุด</th><th class="n">ต้นทุนรวม/ชม.</th><th>เป้าหมาย</th></tr></thead><tbody>
    ${rows.map(r=>`<tr class="${r.best?'best':''}"><td class="mono"><b>${esc(r.s.scenario)}</b>${r.best?' 🏆':''}</td><td>${esc(r.s.description)}</td><td class="n">${r.M.stations.find(s=>s.id==='GATE_IN').c}</td><td class="n">${r.M.stations.find(s=>s.id==='INSP').c}</td><td class="n">${r.M.berth.c}</td><td class="n">${blank(r.s.crane_add)?0:r.s.crane_add}</td><td class="n">${fmt(r.M.caT,2)}</td><td class="n">×${fmt(r.M.lf,2)}</td><td class="n">${fmt(r.truckWq,1)}</td><td class="n">${fmt(r.vesselWq,2)}</td><td class="n">${fmt(r.rhoMax,2)}</td><td class="n"><b>${fmt(r.cost,0)}</b></td><td>${r.meets?pill('ok','ผ่าน'):pill(r.ok?'warn':'bad', r.ok?'ไม่ผ่าน':'ไม่เสถียร')}</td></tr>`).join('')}</tbody></table></div>
    <div class="chart" id="cSc" style="margin-top:14px"></div>
    ${best?`<div class="headline" style="margin-top:12px"><div><div class="eyebrow" style="color:var(--accent)">Best Scenario</div><h2>Scenario ${esc(best.s.scenario)}: ${esc(best.s.description)}</h2>
      <p>ต้นทุนรวม ${fmt(best.cost,0)} บาท/ชม. (ต่ำกว่า Scenario A ${fmt(rows[0].cost-best.cost,0)} บาท/ชม. ในช่วงพีก) · รถรอ ${fmt(best.truckWq,1)} นาที · เรือรอ ${fmt(best.vesselWq,2)} ชม. · ${best.meets?'ผ่านเป้าหมายบริการทั้งรถและเรือ':'ยังไม่ผ่านเป้าหมายบริการบางข้อ'}</p></div><button class="btn pri noprint" id="bSaveRes">บันทึกผลลง Sheets</button></div>`:''}
    <p class="note" style="margin-top:8px">กติกาเลือก Best: ต้นทุนรวมต่ำสุด ในกลุ่มที่ผ่านเป้าหมาย (รถรอ ≤ ${M.P.target_truck_wait} นาที และเรือรอ ≤ ${M.P.target_vessel_wait} ชม.) · Scenario ที่ดีมานด์ ≠ 1.0 ใช้ทดสอบความทนทาน (Stress test) จึงไม่นำมาแข่ง · ระบบนัดหมายรถสมมติว่าไม่มีต้นทุนเพิ่ม</p></div>`;
  document.querySelectorAll('[data-wi]').forEach(el=>{ el.oninput=()=>{ const b=el.parentNode.querySelector('b'); if(b) b.textContent = Number(el.step)<1? fmt(+el.value,2) : el.value; };
    el.onchange=()=>{ WI[el.dataset.wi]=Number(el.value); const y=window.scrollY; pWhatif(); window.scrollTo(0,y); const f=document.querySelector(`[data-wi="${el.dataset.wi}"]`); if(f) f.focus(); }; });
  $('#wReset').onclick=()=>{ WI={gate_in:null,insp:null,berths:null,crane_add:0,truck_ca:null,lambda_factor:1}; pWhatif(); };
  $('#wApply').onclick=()=>{ const g=DB.Stations.find(s=>s.id==='GATE_IN'), i=DB.Stations.find(s=>s.id==='INSP'); g.servers=v.gate_in; i.servers=v.insp; const tc=DB.Params.find(p=>p.key==='truck_ca'); tc.value=v.truck_ca;
    let act=DB.Berths.filter(b=>b.status==='Active').length; DB.Berths.forEach(b=>{ if(act<v.berths && b.status!=='Active'){ b.status='Active'; act++; } }); DB.Berths.slice().reverse().forEach(b=>{ if(act>v.berths && b.status==='Active'){ b.status='Planned'; act--; } });
    WI={gate_in:null,insp:null,berths:null,crane_add:0,truck_ca:null,lambda_factor:1}; recompute(); toast('บันทึกค่า What-if เป็น Master Data แล้ว'); };
  chart($('#cWI'), {labels:['เรือรอ','ท่า','เครน','รถรอ','ช่องบริการ'], series:[{name:'ปัจจุบัน', data:[base.cost.vesselWait,base.cost.berths,base.cost.cranes,base.cost.truckWait,base.cost.stations].map(x=>x/1000), color:'var(--muted)'},{name:'What-if', data:[W.cost.vesselWait,W.cost.berths,W.cost.cranes,W.cost.truckWait,W.cost.stations].map(x=>x/1000), color:'var(--accent)'}], yTitle:'พันบาท/ชม.'});
  chart($('#cSc'), {labels:rows.map(r=>r.s.scenario), series:[{name:'ต้นทุนรวม (พันบาท/ชม.)', data:rows.map(r=>r.cost/1000), color:(v,i)=>rows[i].best?'var(--ok)':Number(rows[i].s.lambda_factor||1)!==1?'var(--muted)':'var(--sea)', labels:v=>fmt(v,0)}], yTitle:'พันบาท/ชม.', h:220});
  if($('#bSaveRes')) $('#bSaveRes').onclick=pushResults;
}
function sl(k,label,v,min,max,step){ return `<label class="slider" for="wi_${k}">${label} <b>${step<1?fmt(v,2):v}</b><input type="range" id="wi_${k}" data-wi="${k}" min="${min}" max="${max}" step="${step}" value="${v}"></label>`; }

/* ================= PAGE: SIMULATION ================= */
let SNODE='GATE_IN', SREPS=30, SN=4000;
function pSim(){
  const N=nodeInfo(SNODE), ts=N.tscale;
  $('#app').innerHTML = `
  <div class="pagehead"><div><div class="eyebrow">Discrete-Event Simulation · Monte Carlo</div><h2>จำลองแถวคอยหลายรอบ แล้วเทียบกับสูตร</h2><p>สุ่มเวลามาถึงและเวลาบริการตาม Ca, Cs ของข้อมูล (การแจกแจง Gamma ที่มีค่าเฉลี่ยและ CV ตรงกับ Master Data) ให้บริการแบบมาก่อน–ได้ก่อน รันซ้ำหลายรอบแล้วหาช่วงความเชื่อมั่น 95%</p></div></div>
  <div class="panel noprint"><div class="row">${[...M.stations.map(s=>[s.id,s.name]),['BERTH','ท่าเทียบเรือ']].map(([k,t])=>`<button class="btn sm ${k===SNODE?'pri':''}" data-sn="${k}">${esc(t)}</button>`).join('')}</div>
    <div class="ctrl" style="margin-top:12px"><label class="field">จำนวนรอบ (≥ 20)<input type="number" id="sReps" min="20" max="200" value="${SREPS}"></label><label class="field">ลูกค้าต่อรอบ<input type="number" id="sN" min="500" max="20000" step="500" value="${SN}"></label>
    <div class="field" style="align-self:end"><button class="btn pri" id="sRun">RUN SIMULATION</button></div></div>
    <p class="note">${esc(N.name)}: λ = ${fmt(N.lam,3)} ${N.unitA}, เวลาบริการ ${fmt(N.svc,2)} ${N.svcUnit}, Ca = ${fmt(N.ca,2)}, Cs = ${fmt(N.cs,3)} · ตัด 10% แรกทิ้ง (Warm-up) เพื่อไม่ให้ช่วงเริ่มที่คิวว่างทำให้ผลต่ำเกินจริง</p></div>
  <div id="simOut">${SIM&&SIM.node===SNODE?simTable():'<div class="panel"><p class="note">กด RUN SIMULATION เพื่อเริ่ม</p></div>'}</div>`;
  document.querySelectorAll('[data-sn]').forEach(b=>b.onclick=()=>{SNODE=b.dataset.sn; SIM=null; pSim();});
  $('#sRun').onclick=()=>{ SREPS=Math.max(20,Math.min(200,+$('#sReps').value||30)); SN=Math.max(500,Math.min(20000,+$('#sN').value||4000));
    $('#simOut').innerHTML='<div class="panel"><p class="note">กำลังจำลอง…</p></div>';
    setTimeout(()=>{ const c0=N.c; const cs=[]; const cmin=Math.floor(N.lam/N.mu)+1; for(let c=Math.max(cmin,c0-1);c<=c0+2;c++) cs.push(c);
      const t=performance.now(); SIM={node:SNODE, ts, unit:N.unitT, res:cs.map(c=>simulateNode(M,SNODE,c,SREPS,SN,20261106)), ms:performance.now()-t}; $('#simOut').innerHTML=simTable(); drawSim(); },30); };
  if(SIM&&SIM.node===SNODE) drawSim();
}
function simTable(){
  const ts=SIM.ts, u=SIM.unit;
  return `<div class="grid2"><div class="panel"><h3>ผลจำลอง ${SIM.res[0].reps} รอบ/ค่า c <span class="note">(${fmt(SIM.ms,0)} ms)</span></h3><div class="tbl"><table><thead><tr><th class="n">c</th><th class="n">ρ</th><th class="n">Wq จำลอง (${u})</th><th class="n">95% CI ±</th><th class="n">Wq M/M/c</th><th class="n">Wq G/G/c</th><th class="n">ต่างจาก G/G/c</th><th class="n">Util จำลอง</th></tr></thead><tbody>
  ${SIM.res.map(r=>{ const d=(r.wq-r.ggc)/r.ggc; return `<tr><td class="n">${r.c}</td><td class="n">${fmt(r.rho,3)}</td><td class="n"><b>${fmt(r.wq*ts,3)}</b></td><td class="n">${fmt(r.ci*ts,3)}</td><td class="n">${fmt(r.mmc*ts,3)}</td><td class="n">${fmt(r.ggc*ts,3)}</td><td class="n">${isFinite(d)?(d>0?'+':'')+fmt(d*100,1)+'%':'–'}</td><td class="n">${fmt(r.util*100,1)}%</td></tr>`; }).join('')}</tbody></table></div>
  <p class="why">${simExplain()}</p></div>
  <div class="panel"><h3>Wq: จำลอง (พร้อมช่วงความเชื่อมั่น) vs สูตร</h3><div class="chart" id="cSim"></div><h3 style="margin-top:14px">ผลแต่ละรอบ (c ปัจจุบัน)</h3><div class="chart" id="cRuns"></div></div></div>`;
}
function simExplain(){
  const cur = SIM.res.find(r=>r.c===nodeInfo(SNODE).c)||SIM.res[0]; const ts=SIM.ts;
  const dG=Math.abs(cur.wq-cur.ggc)/cur.ggc, dM=Math.abs(cur.wq-cur.mmc)/cur.mmc;
  const inCI = Math.abs(cur.wq-cur.ggc)<=cur.ci;
  return `ที่ c = ${cur.c}: ผลจำลอง ${fmt(cur.wq*ts,2)} ${SIM.unit} ใกล้ G/G/c (ต่าง ${fmt(dG*100,1)}%) ${dG<dM?'มากกว่า':'น้อยกว่า'} M/M/c (ต่าง ${fmt(dM*100,1)}%) ${inCI?'และสูตร G/G/c อยู่ในช่วงความเชื่อมั่น 95% ของการจำลอง':'สูตร G/G/c อยู่นอกช่วงความเชื่อมั่น'} · เหตุผล: M/M/c สมมติว่าเวลาบริการแปรปรวนแบบ Exponential (Cs = 1) แต่ข้อมูลจริง Cs = ${fmt(nodeInfo(SNODE).cs,2)} จึงรอน้อยกว่าที่ M/M/c ทำนาย ส่วน Allen–Cunneen เป็นค่าประมาณ ยิ่ง ρ สูงยิ่งคลาดเคลื่อนได้มาก ผลจำลองจึงใช้ยืนยันว่าการตัดสินใจจากสูตรเชื่อถือได้`;
}
function drawSim(){
  const ts=SIM.ts;
  chart($('#cSim'), {labels:SIM.res.map(r=>'c='+r.c), series:[{name:'จำลอง ±95% CI', data:SIM.res.map(r=>r.wq*ts), err:SIM.res.map(r=>r.ci*ts), color:'var(--sea)'},{name:'M/M/c', type:'line', data:SIM.res.map(r=>r.mmc*ts), color:'var(--muted)', dash:true, dots:true},{name:'G/G/c', type:'line', data:SIM.res.map(r=>r.ggc*ts), color:'var(--accent)', dots:true}], yTitle:SIM.unit, h:230});
  const cur=SIM.res.find(r=>r.c===nodeInfo(SNODE).c)||SIM.res[0];
  chart($('#cRuns'), {labels:cur.runs.map((_,i)=>String(i+1)), series:[{name:'Wq แต่ละรอบ', data:cur.runs.map(x=>x*ts), color:'var(--sea)'}], refs:[{y:cur.wq*ts,label:'ค่าเฉลี่ย',color:'var(--ink)'},{y:cur.ggc*ts,label:'G/G/c',color:'var(--accent)'}], yTitle:SIM.unit, h:180, maxLabels:10});
}

let TW=null, twRAF=null;
function twinInit(){
  const g=M.stations.find(s=>s.id==='GATE_IN'), ins=M.stations.find(s=>s.id==='INSP'), rtg=M.stations.find(s=>s.id==='RTG');
  TW = {t:7*60, speed:TW?TW.speed:5, run:true, trucks:[], gq:[], iq:[], vq:[], lanes:Array(12).fill(null).map(()=>({busy:null})), insp:Array(8).fill(null).map(()=>({busy:null})),
    berths:Array(8).fill(null).map(()=>({v:null})), nextT:7*60, nextV:7*60, ev:{gate:false, crane:false, peak:false}, done:[], doneI:[], vdone:[], id:0, vid:0, g, ins, rtg, last:performance.now()};
  G3.ships={}; G3.sKey=''; G3.fresh=true;
  for(let k=0;k<3;k++) twNewVessel(); // เริ่มด้วยเรือที่มาจากกะก่อน
  for(let m=0;m<60;m+=0.5) twStep(0.5); // อุ่นระบบ 1 ชม. ให้คิวเข้าสู่สภาวะปกติก่อนแสดงผล
}

function twLanes(){ return Math.max(1, TW.g.c - (TW.ev.gate?1:0)); }
function twNewVessel(){
  const cls=M.berth.svc.cls; let u=Math.random(), acc=0, k=cls[cls.length-1]; for(const x of cls){ acc+=x.p; if(u<=acc){k=x;break;} }
  const moves = Math.round(sampleMeanCv(Math.random, k.moves, 0.12));
  TW.vq.push({id:++TW.vid, cls:k.cls, moves, left:moves, cranes:k.cranes, fixed:k.fixed*60, phase:'wait', arr:TW.t, hc:Math.floor(Math.random()*4)});
}
function twStep(dt){
  const T=TW; T.t+=dt; const lamT = M.lamT*(T.ev.peak?1.3:1);
  while(T.nextT<=T.t){ const tr={id:++T.id, st:'road', arr:T.nextT, ins:Math.random()<TW.ins.visit, ci:T.id%5, box:Math.random()<0.7}; T.trucks.push(tr); T.gq.push(tr); T.nextT += sampleMeanCv(Math.random, 60/lamT, M.caT); }
  while(T.nextV<=T.t){ twNewVessel(); T.nextV += sampleMeanCv(Math.random, 60/M.berth.lam, Number(M.P.vessel_ca)); }
  const nl=twLanes();
  const afterGate=tr=>{ if(tr.ins){ tr.st='iq'; T.iq.push(tr); } else { tr.st='yard'; tr.until=T.t+sampleMeanCv(Math.random, TW.rtg.service, TW.rtg.cv)+4; } };
  for(let i=0;i<T.lanes.length;i++){ const L=T.lanes[i]; if(L.busy && L.busy.until<=T.t){ afterGate(L.busy.tr); L.busy=null; }
    if(i<nl && !L.busy && T.gq.length){ const tr=T.gq.shift(); T.done.push(T.t-tr.arr); if(T.done.length>200) T.done.shift(); tr.st='gate'; tr.lane=i; L.busy={tr, until:T.t+sampleMeanCv(Math.random, TW.g.service, TW.g.cv)}; } }
  for(let i=0;i<TW.ins.c;i++){ const S=T.insp[i]; if(S.busy && S.busy.until<=T.t){ const tr=S.busy.tr; tr.st='yard'; tr.until=T.t+sampleMeanCv(Math.random, TW.rtg.service, TW.rtg.cv)+4; S.busy=null; }
    if(!S.busy && T.iq.length){ const tr=T.iq.shift(); T.doneI.push(T.t-(tr.iqT||T.t)); if(T.doneI.length>100) T.doneI.shift(); tr.st='insp'; tr.slot=i; S.busy={tr, until:T.t+sampleMeanCv(Math.random, TW.ins.service, TW.ins.cv)}; } }
  T.iq.forEach(tr=>{ if(tr.iqT==null) tr.iqT=T.t; });
  T.trucks.forEach(tr=>{ if(tr.st==='yard' && tr.until<=T.t){ tr.st='out'; tr.outT=T.t; tr.box=Math.random()<0.5; } });
  const keep = (G3.mode==='3d' && G3.gl) ? 45 : 6;
  T.trucks = T.trucks.filter(tr=> !(tr.st==='out' && (tr.gone || T.t-tr.outT>keep)));
  // vessels
  const nb = M.berth.c;
  for(let i=0;i<nb;i++){ const B=T.berths[i]; const v=B.v;
    if(v){ if(v.phase==='berthing'){ v.ft-=dt; if(v.ft<=0) v.phase='work'; }
      else if(v.phase==='work'){ const cr = Math.max(1, v.cranes - (T.ev.crane && i===0 ? 1:0)); v.left -= cr*M.berth.svc.rate*dt/60; if(v.left<=0){ v.left=0; v.phase='leave'; v.ft=v.fixed/2; } }
      else if(v.phase==='leave'){ v.ft-=dt; if(v.ft<=0){ B.v=null; } } }
    if(!B.v && T.vq.length){ const v=T.vq.shift(); T.vdone.push((T.t-v.arr)/60); if(T.vdone.length>50) T.vdone.shift(); v.phase='berthing'; v.ft=v.fixed/2; B.v=v; } }
}
function twLoop(now){
  if(!TW) return; const dtReal=Math.min(0.1,(now-TW.last)/1000); TW.last=now;
  if(TW.run){ let dt=dtReal*TW.speed; while(dt>0){ const s=Math.min(dt,0.5); twStep(s); dt-=s; } G3.rt+=dtReal; }
  if(G3.mode==='3d' && G3.gl){ try{ g3Render(dtReal); }catch(e){ console.error(e); G3.gl=null; G3.mode='2d'; pTwin(); return; } } else twDraw();
  twStats();
  if(current()==='twin') twRAF=requestAnimationFrame(twLoop);
}
function twStats(){
  const st=$('#twStats'); if(!st) return; twStats.n=(twStats.n||0)+1; if(twStats.n%10!==1) return;
  const occ=TW.berths.slice(0,M.berth.c).filter(b=>b.v).length;
  const hh=Math.floor(TW.t/60)%24, mm=Math.floor(TW.t%60), day=Math.floor(TW.t/1440)+1;
  const ck=$('#twClock'); if(ck) ck.textContent=`วันที่ ${day} · ${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')} น.`;
  st.innerHTML = [['รถรอหน้าประตู', TW.gq.length+' คัน'], ['รอประตูเฉลี่ย (200 คันล่าสุด)', fmt(mean(TW.done),1)+' นาที'], ['ทฤษฎี Wq ประตู', fmt(queueNode(M.lamT*(TW.ev.peak?1.3:1), TW.g.mu, twLanes(), M.caT, TW.g.cv, M.model).sel.wq*60,1)+' นาที'], ['คิว X-ray', TW.iq.length+' คัน'], ['เรือรอที่ทุ่น', TW.vq.length+' ลำ'], ['ท่าที่มีเรือ', occ+' / '+M.berth.c], ['เรือรอเฉลี่ย (จำลอง)', fmt(mean(TW.vdone),1)+' ชม.']]
    .map(([a,b])=>`<div class="kpi"><span class="lb">${a}</span><span class="v" style="font-size:1.1rem">${b}</span></div>`).join('');
}

  for(let r=0;r<3;r++) for(let c=0;c<4;c++){ const bx=430+c*95, by=44+r*92; x.fillStyle=C('--yard'); x.fillRect(bx,by,80,70); const fill=Math.round(yu*20); for(let k=0;k<20;k++){ if(k<fill+((r+c)%3)-1){ x.fillStyle=[C('--accent'),C('--sea'),C('--ok'),C('--warn')][(k+r+c)%4]; x.fillRect(bx+4+(k%5)*15, by+4+Math.floor(k/5)*16, 13, 13); } } }
  x.strokeStyle=zc(TW.rtg.q.rho); x.lineWidth=2; x.strokeRect(424,38,386,286);

function hsh(a,b,c){ let h=(Math.imul(a|0,374761393) + Math.imul(b|0,668265263) + Math.imul(c|0,1274126177))|0; h=Math.imul(h^(h>>>13),1274126177); return ((h^(h>>>16))>>>0)/4294967296; }

const IST=12; // ข้อมูลต่อกล่อง: ตำแหน่ง(3) ขนาด(3) หมุนรอบแกน Y, สี(3), วัสดุ, มุมเอียง
class Batch{ constructor(n){ this.a=new Float32Array(n*IST); this.n=0; }
  box(x,y,z,sx,sy,sz,col,rot,mat,tilt){ if((this.n+1)*IST>this.a.length){ const b=new Float32Array(this.a.length*2); b.set(this.a); this.a=b; }
    const o=this.n*IST, a=this.a; a[o]=x;a[o+1]=y;a[o+2]=z;a[o+3]=sx;a[o+4]=sy;a[o+5]=sz;a[o+6]=rot||0;a[o+7]=col[0];a[o+8]=col[1];a[o+9]=col[2];a[o+10]=mat||0;a[o+11]=tilt||0; this.n++; }
  reset(){ this.n=0; } }
// วางกล่องในพิกัดท้องถิ่นของวัตถุที่หมุนรอบแกน Y (เรือ รถ) — tilt = เอียงในระนาบหน้า-หลังของวัตถุ

function g3Trucks(dt,L,D){
  const T=TW, nl=Math.max(1,twLanes()), sp=8*clamp(T.speed/5,0.6,6), R1=L.R1, R0=L.R0;
  T.gq.forEach((tr,q)=>{ tr._k='r'+q; tr._t={x:L.laneX(q%nl), z:L.gateZ+2.2+Math.floor(q/nl)*2.6}; });
  T.iq.forEach((tr,k)=>{ tr._k='q'+k; tr._t={x:L.xX(k%L.insC), z:L.xrZ+3.4+Math.floor(k/L.insC)*2.6}; });
  T.trucks.forEach(tr=>{
    let ax=null;
    if(tr.st==='gate'){ tr._k='g'+tr.lane; tr._t={x:L.laneX(tr.lane), z:L.gateZ}; }
    else if(tr.st==='insp'){ tr._k='i'+tr.slot; tr._t={x:L.xX(tr.slot), z:L.xrZ}; }
    else if(tr.st==='yard'){ const bk=L.blocks[tr.id%L.blocks.length]; ax=bk.ax; tr._k='y'; tr._t={x:bk.x+(hsh(tr.id,7,1)-0.5)*12, z:bk.z-1.15}; }
    else if(tr.st==='out'){ tr._k='o'; tr._t={x:L.outX(tr.id%L.outC), z:L.zEnd+82}; }
    if(!tr._t) return;
    if(!tr.g) tr.g={x:tr._t.x, z: (tr.st==='road' && !G3.fresh)? L.zEnd+82 : tr._t.z, h:Math.PI/2, path:[], k:'', prev:null, ax:null, pt:0};
    const g=tr.g, t=tr._t;
    if(g.k!==tr._k){ let p;
      if(tr.st==='iq' && g.prev==='gate') p=[{x:g.x,z:R1},{x:t.x,z:R1},t];
      else if(tr.st==='yard' && g.prev==='gate') p=[{x:g.x,z:R1},{x:ax,z:R1},{x:ax,z:t.z},t];
      else if(tr.st==='yard' && g.prev==='insp') p=[{x:g.x,z:L.xrZ-2.4},{x:g.x,z:R0},{x:ax,z:R0},{x:ax,z:t.z},t];
      else if(tr.st==='out' && g.prev==='yard') p=[{x:g.ax,z:g.z},{x:g.ax,z:R1},{x:t.x,z:R1},{x:t.x,z:L.gateZ},t];
      else p=[t];
      g.path=p; g.k=tr._k; g.prev=tr.st; g.pt=0; if(ax!=null) g.ax=ax; }
    g.pt+=dt; if(g.pt>12 && g.path.length){ const e=g.path[g.path.length-1]; g.x=e.x; g.z=e.z; g.path=[]; }
    let bud=sp*dt;
    while(bud>0 && g.path.length){ const w=g.path[0], dx=w.x-g.x, dz=w.z-g.z, d=Math.hypot(dx,dz);
      const straight = tr.st==='road'||tr.st==='gate'||tr.st==='iq'||tr.st==='insp';
      if(d>0.01){ const want = straight && !(g.prev==='gate' && tr.st==='iq' && g.path.length>1) ? Math.PI/2 : Math.atan2(-dz,dx); g.h += angD(want,g.h)*Math.min(1,dt*9); }
      if(d<=bud){ g.x=w.x; g.z=w.z; bud-=d; g.path.shift(); } else { g.x+=dx/d*bud; g.z+=dz/d*bud; bud=0; } }
    if(tr.st==='out' && !g.path.length && Math.abs(g.z-(L.zEnd+82))<1) tr.gone=true;
    g3Truck(D, g.x, g.z, g.h, CAB[tr.ci||0], tr.box ? CONT[tr.id%CONT.length] : null);
  });
  // ไฟสถานะช่องประตู
  for(let i=0;i<TW.g.c;i++){ const closed=TW.ev.gate && i>=twLanes(); const x=L.laneX(i);
    D.box(x, GY+1.0, L.gateZ-0.8, 0.22, 0.1, 0.06, closed?PAL.lampR:PAL.lampG, 0, 1);
    if(closed) D.box(x, GY+0.42, L.gateZ-0.75, 1.0, 0.05, 0.05, PAL.red); else D.box(x-0.5, GY+0.42, L.gateZ-0.75, 0.05, 0.9, 0.05, PAL.red); }
}

  <div class="panel"><h3>1. ข้อมูลเข้า → อัตรา</h3><div class="calc">λ_จุด = λ_รถ × visit_ratio                <span class="c">(คัน/ชม.)</span>
μ = 60 ÷ เวลาบริการ(นาที)                 <span class="c">(คัน/ชม./ช่อง)</span>
S_เรือ = moves ÷ (เครน × moves/ชม.) + fixed  <span class="c">(ชม./ลำ)</span>
E[S] = Σ pᵢ·Sᵢ ,  Cs = √(E[S²] − E[S]²) ÷ E[S]</div><p class="why">แปลงทุกค่าเป็น "ต่อชั่วโมง" ก่อนเสมอ เพราะความผิดพลาดที่พบบ่อยคือใช้ λ ต่อชั่วโมงกับเวลาบริการเป็นนาที</p></div>
  <div class="panel"><h3>2. M/M/c และ Erlang C</h3><div class="calc">a = λ/μ          ρ = λ/(c·μ) < 1
P(wait) = [aᶜ/c! · 1/(1−ρ)] ÷ [Σₖ₌₀^(c−1) aᵏ/k! + aᶜ/c! · 1/(1−ρ)]
Wq = P(wait) ÷ (c·μ − λ)     Lq = λ·Wq
W = Wq + 1/μ                 L = λ·W   <span class="c">(Little's Law)</span>
Throughput = λ  เมื่อ ρ < 1</div><p class="why">ใช้ M/M/c เพราะประตู ท่า และจุดตรวจ มีหลายช่องใช้คิวเดียวกัน ถ้า ρ ≥ 1 ระบบแจ้งเตือนแทนการคำนวณ เพราะสูตรจะให้ค่าติดลบที่ไม่มีความหมาย</p></div>
  <div class="panel"><h3>3. Allen–Cunneen (G/G/c)</h3><div class="calc">Wq(G/G/c) ≈ Wq(M/M/c) × (Ca² + Cs²) ÷ 2
Ca = SD(เวลาระหว่างมาถึง) ÷ ค่าเฉลี่ย
Cs = SD(เวลาบริการ) ÷ ค่าเฉลี่ย</div><p class="why">รถนัดหมาย (Ca ≈ 0.5) มาสม่ำเสมอกว่ารถ Walk-in (Ca ≈ 1) จึงรอน้อยกว่าแม้ λ เท่ากัน สูตรนี้เป็นค่าประมาณ แม่นเมื่อ ρ ไม่สูงมาก จึงตรวจซ้ำด้วย Simulation</p></div>
  <div class="panel"><h3>4. ต้นทุนรวมและการเลือกทางเลือก</h3><div class="calc">TC(c) = Lq(c) × ต้นทุนรอ + c × ต้นทุนทรัพยากร
TC_ท่าเรือ = Σ_จุดรถ(Lq·600) + Σ(c·ค่าช่อง)
           + Lq_เรือ·45,000 + ท่า·18,000 + เครน·5,500
Best = argmin TC  โดย ρ < 1 ทุกจุด</div><p class="why">ไม่เลือกจากเวลารอสั้นสุด เพราะเพิ่มทรัพยากรได้เสมอแต่มีต้นทุน จุดที่ต้นทุนรวมต่ำสุดคือจุดสมดุลระหว่างต้นทุนรอกับต้นทุนให้บริการ</p></div>
  <div class="panel"><h3>5. Simulation</h3><div class="calc">tₐ ~ Gamma(mean = 1/λ, CV = Ca)
S  ~ Gamma(mean = E[S], CV = Cs)
start = max(arrival, เซิร์ฟเวอร์ว่างเร็วสุด)   wait = start − arrival
95% CI = x̄ ± t(0.025, n−1) · s/√n      (n ≥ 20 รอบ, ตัด warm-up 10%)</div></div>
  <div class="panel"><h3>6. พยากรณ์ (Predictive)</h3><div class="calc">T_d = a + b·d                  <span class="c">(Least squares)</span>
s_h = Σ_d y_dh ÷ Σ_d T_d
λ̂_h = T̂_(d+1) × s_h
WAPE = Σ|จริง − พยากรณ์| ÷ Σ จริง</div></div>
  </div>
  <div class="panel"><h3>ตัวอย่างคำนวณมือ (ข้อมูลตัวอย่างเริ่มต้น) เทียบผลในระบบ</h3><div class="calc"><span class="h">ประตูเข้า</span> λ = 90 คัน/ชม., บริการ 3.0 นาที → μ = 20, c = 5, a = 4.5, ρ = 0.90
Σ = 1 + 4.5 + 10.125 + 15.1875 + 17.0859 = 47.8984 ;  a⁵/5! = 15.3773
aᶜ/c!·1/(1−ρ) = 153.773 → P(wait) = 153.773 ÷ 201.672 = 0.7625
Wq = 0.7625 ÷ (100 − 90) = 0.07625 ชม. = <span class="r">4.575 นาที</span> ,  Lq = <span class="r">6.86 คัน</span>
G/G/c: × (1.0² + 0.6²)/2 = × 0.68 → Wq = <span class="r">3.11 นาที</span> ,  Lq = <span class="r">4.67 คัน</span>
<span class="h">ท่าเทียบเรือ</span> E[S] = 0.5×10.929 + 0.35×17.286 + 0.15×21.857 = 14.793 ชม. → μ = 0.0676
λ = 0.25, c = 4 → a = 3.698, ρ = 0.925, P(wait) = 0.838, Wq(M/M/c) = <span class="r">41.1 ชม.</span>
G/G/c: × (0.8² + 0.320²)/2 = × 0.371 → Wq = <span class="r">15.2 ชม.</span> ; c = 5 → Wq = <span class="r">1.87 ชม.</span></div>
  <p class="note">ผลในระบบดูได้ที่หน้า <a href="#queue">คำนวณแถวคอย</a> (ตรงกันทศนิยมที่แสดง เมื่อใช้ข้อมูลตัวอย่าง)</p></div>
